<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المسؤول - Mega Cars</title>
    <link rel="stylesheet" href="../css/admin-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="../js/i18n.js"></script>
</head>
<body>
    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <img src="../images/logo-small.png" alt="Mega Cars" class="sidebar-logo">
                <span data-i18n="admin.roleLabel" class="admin-role-label">Admin Panel</span>
            </div>
            <nav class="admin-menu">
                <a href="#" class="admin-menu-item active" onclick="showAdminSection('dashboard', event)">
                    <i class="fas fa-chart-line"></i><span data-i18n="admin.menu.dashboard">Dashboard</span>
                </a>
                <a href="#" class="admin-menu-item" onclick="showAdminSection('cars', event)">
                    <i class="fas fa-car"></i><span data-i18n="admin.menu.cars">Manage Cars</span>
                </a>
                <a href="#" class="admin-menu-item" onclick="showAdminSection('users', event)">
                    <i class="fas fa-users"></i><span data-i18n="admin.menu.users">Manage Users</span>
                </a>
                <a href="#" class="admin-menu-item" onclick="showAdminSection('sales', event)">
                    <i class="fas fa-shopping-cart"></i><span data-i18n="admin.menu.sales">Sales Reports</span>
                </a>
                <a href="#" class="admin-menu-item" onclick="showAdminSection('settings', event)">
                    <i class="fas fa-cog"></i><span data-i18n="admin.menu.settings">Settings</span>
                </a>
                <a href="../index.html" class="admin-menu-item">
                    <i class="fas fa-home"></i><span data-i18n="nav.home">Home</span>
                </a>
                <a href="#" class="admin-menu-item" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i><span data-i18n="admin.menu.logout">Logout</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-avatar"><i class="fas fa-shield-alt"></i></div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name" id="adminSidebarName">Admin</div>
                    <div class="sidebar-user-role" data-i18n="admin.menu.dashboard">مسؤول</div>
                </div>
            </div>
        </aside>

        <main class="admin-content">
            <header class="admin-top-bar">
                <h2 id="adminPageTitle" data-i18n="admin.section.dashboard">لوحة التحكم</h2>
                <div class="admin-user-menu">
                    <button id="langToggleBtn" class="lang-toggle-btn" onclick="toggleLang()">EN</button>
                </div>
            </header>

            <section id="dashboard" class="admin-section">
                <div class="welcome-banner">
                    <div class="welcome-text">
                        <h3 id="adminWelcomeGreeting">Welcome</h3>
                        <p data-i18n="admin.welcomeSub">Here's a system-wide overview</p>
                    </div>
                    <div class="welcome-date">
                        <strong id="adminWelcomeDay"></strong>
                        <span id="adminWelcomeDate"></span>
                    </div>
                </div>
                <div class="dashboard-stats">
                    <div class="stat-box">
                        <div class="stat-icon blue"><i class="fas fa-users"></i></div>
                        <div class="stat-info">
                            <h3 data-i18n="admin.stat.users">إجمالي المستخدمين</h3>
                            <p id="statsUsers">0</p>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-icon amber"><i class="fas fa-car"></i></div>
                        <div class="stat-info">
                            <h3 data-i18n="admin.stat.cars">إجمالي السيارات</h3>
                            <p id="statsCars">0</p>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-icon green"><i class="fas fa-shopping-cart"></i></div>
                        <div class="stat-info">
                            <h3 data-i18n="admin.stat.sales">إجمالي المبيعات</h3>
                            <p id="statsSales">0</p>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-icon orange"><i class="fas fa-dollar-sign"></i></div>
                        <div class="stat-info">
                            <h3 data-i18n="admin.stat.revenue">إجمالي الإيرادات</h3>
                            <p id="statsRevenue">$0</p>
                        </div>
                    </div>
                </div>
            </section>

            <section id="cars" class="admin-section hidden">
                <div class="section-header">
                    <h3 class="section-title"><i class="fas fa-car"></i> <span data-i18n="admin.cars.title">إدارة السيارات</span></h3>
                    <button class="btn btn-primary" onclick="showAddCarForm()">
                        <i class="fas fa-plus"></i> <span data-i18n="admin.cars.addNew">إضافة سيارة جديدة</span>
                    </button>
                </div>
                <form id="addCarForm" class="add-car-form hidden">
                    <div class="form-row">
                        <div class="form-group">
                            <label data-i18n="admin.cars.brand">الماركة</label>
                            <input type="text" name="brand" required>
                        </div>
                        <div class="form-group">
                            <label data-i18n="admin.cars.model">الموديل</label>
                            <input type="text" name="model" required>
                        </div>
                        <div class="form-group">
                            <label data-i18n="admin.cars.year">السنة</label>
                            <input type="number" name="year" required>
                        </div>
                        <div class="form-group">
                            <label data-i18n="admin.cars.price">السعر</label>
                            <input type="number" name="price" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label data-i18n="admin.cars.mileage">المسافة</label>
                            <input type="number" name="mileage" required>
                        </div>
                        <div class="form-group">
                            <label data-i18n="admin.cars.color">اللون</label>
                            <input type="text" name="color">
                        </div>
                        <div class="form-group">
                            <label data-i18n="admin.cars.fuel">الوقود</label>
                            <select name="fuel">
                                <option>petrol</option><option>diesel</option>
                                <option>hybrid</option><option>electric</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label data-i18n="admin.cars.status">الحالة</label>
                            <select name="status">
                                <option>available</option><option>sold</option><option>pending</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-buttons">
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-check"></i> <span data-i18n="admin.cars.add">إضافة السيارة</span>
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="hideAddCarForm()">
                            <i class="fas fa-times"></i> <span data-i18n="admin.cars.cancel">إلغاء</span>
                        </button>
                    </div>
                </form>
                <div id="carsList" class="cars-table"></div>
            </section>

            <section id="users" class="admin-section hidden">
                <div class="section-header">
                    <h3 class="section-title"><i class="fas fa-users"></i> <span data-i18n="admin.users.title">إدارة المستخدمين</span></h3>
                </div>
                <div id="usersList" class="users-table"></div>
            </section>

            <section id="sales" class="admin-section hidden">
                <div class="section-header">
                    <h3 class="section-title"><i class="fas fa-chart-bar"></i> <span data-i18n="admin.sales.title">تقارير المبيعات</span></h3>
                </div>
                <div id="salesReport" class="sales-table"></div>
            </section>

            <section id="settings" class="admin-section hidden">
                <div class="section-header">
                    <h3 class="section-title"><i class="fas fa-cog"></i> <span data-i18n="admin.settings.title">إعدادات النظام</span></h3>
                </div>
                <div class="settings-card">
                    <form id="systemSettingsForm" class="settings-form">
                        <div class="form-group">
                            <label data-i18n="admin.settings.companyName">اسم الشركة</label>
                            <input type="text" value="Mega Cars">
                        </div>
                        <div class="form-group">
                            <label data-i18n="admin.settings.location">الموقع</label>
                            <input type="text" value="Dohok, Iraq">
                        </div>
                        <div class="form-group">
                            <label data-i18n="admin.settings.phone">الهاتف</label>
                            <input type="tel" placeholder="+964 (0) XXX XXXX XXX">
                        </div>
                        <div class="form-group">
                            <label data-i18n="admin.settings.email">البريد الإلكتروني</label>
                            <input type="email" placeholder="info@megacars.com">
                        </div>
                        <div class="form-group" style="grid-column:1/-1">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> <span data-i18n="admin.settings.save">حفظ الإعدادات</span>
                            </button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/admin-dashboard.js"></script>
</body>
</html>
